  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Workstation</title>
  <style>
    /* ── A working computer ──
       The learner sits at a real-looking desktop: a night wallpaper with the
       Splunk pink-to-orange light in it, a dark glass menu bar and dock with
       app icons, and white app windows with proper title bars. Color is kept
       for meaning: blue for selection and links, pink-to-orange for the one
       action that matters (Send handoff), green for attached evidence, red for
       what was missed. Fonts are bundled; nothing loads from the network. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef0f5;
      --bg-alt: #f6f7fa;
      --surface: #ffffff;
      --surface-alt: #e4e7ee;
      --text: #1b1f2e;
      --text-muted: #575f73;
      --accent: #1668d4;
      --success: #16804a;
      --error: #cf2a4a;
      --warning: #a35a00;

      --pink: #f2338b;
      --orange: #ff6d1f;
      --brand-grad: linear-gradient(100deg, var(--pink), var(--orange));
      /* The same light, deepened so white type on it passes AA: buttons, badges, list numerals. */
      --pink-ink: #d01a6a;
      --orange-ink: #c0410f;
      --brand-ink-grad: linear-gradient(100deg, var(--pink-ink), var(--orange-ink));
      --brand-fill: var(--brand-ink-grad);
      --night: #0a0f2c;

      --hairline: color-mix(in oklab, var(--text) 11%, var(--surface));
      --hairline-strong: color-mix(in oklab, var(--text) 22%, var(--surface));
      --accent-soft: color-mix(in oklab, var(--accent) 10%, var(--surface));
      --success-soft: color-mix(in oklab, var(--success) 10%, var(--surface));

      --glass: rgba(14, 17, 40, 0.62);
      --glass-line: rgba(255, 255, 255, 0.14);

      --shadow-sm: 0 1px 2px rgba(10, 14, 40, 0.10);
      --shadow-md: 0 0 0 1px rgba(8, 10, 30, 0.30), 0 10px 30px rgba(4, 6, 24, 0.40);
      --shadow-lg: 0 0 0 1px rgba(8, 10, 30, 0.34), 0 22px 60px rgba(4, 6, 24, 0.55);

      --space-3xs: 0.125rem; --space-2xs: 0.25rem; --space-xs: 0.5rem;
      --space-sm: 0.75rem;   --space-md: 1rem;     --space-lg: 1.5rem;
      --space-xl: 2rem;

      --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;

      --font-display: 'Libre Franklin Variable', 'Libre Franklin', system-ui, sans-serif;
      --font-sans: 'Spline Sans Variable', 'Spline Sans', system-ui, sans-serif;

      --bar-h: 2.25rem;
      --dock-h: 5.25rem;
    }

    html {
      /* One root ramp, so a window keeps its proportions from a laptop to a
         1440p experience window. */
      font-size: clamp(16px, 0.4vw + 0.4vh + 6px, 21px);
      height: 100%;
    }
    body {
      height: 100%; overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--night);
    }
    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
    img { display: block; }
    ::selection { background: color-mix(in oklab, var(--accent) 24%, var(--surface)); color: var(--text); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* ── The screen ── */
    .os {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      background: var(--wallpaper, none) center / cover no-repeat, var(--night);
      user-select: none;
    }

    /* ── Menu bar ── */
    .menubar {
      flex: 0 0 var(--bar-h);
      display: flex; align-items: center; gap: var(--space-sm);
      padding: 0 var(--space-md);
      background: var(--glass);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      backdrop-filter: blur(18px) saturate(1.4);
      border-bottom: 1px solid var(--glass-line);
      color: #f3f4fa;
      z-index: 5000;
    }
    .mb-mark {
      width: 1.05rem; height: 1.05rem; border-radius: 4px; flex: 0 0 auto;
      background: var(--brand-grad);
      box-shadow: 0 1px 3px rgba(4, 6, 24, 0.45);
    }
    .mb-brand { font-family: var(--font-display); font-weight: 750; font-size: 0.9375rem; white-space: nowrap; }
    .mb-who {
      font-size: 0.8125rem; color: rgba(243, 244, 250, 0.72);
      padding-left: var(--space-sm); border-left: 1px solid var(--glass-line);
    }
    .mb-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-sm); }
    .mb-who, .mb-sound { white-space: nowrap; }
    @media (max-width: 760px) { .mb-who { display: none; } }
    .mb-alerts { font-size: 0.8125rem; font-weight: 600; color: rgba(243, 244, 250, 0.72); }
    .mb-alerts.hot { color: #fff; background: var(--error); padding: 0 0.5rem; border-radius: 999px; }
    .mb-alerts.cold { color: #ff9fb2; }
    .mb-clock {
      font-variant-numeric: tabular-nums;
      font-size: 0.9375rem; font-weight: 650; letter-spacing: 0.02em;
      min-width: 3.2rem; text-align: right;
    }
    .mb-clock.over { color: #ff8aa0; }
    .mb-sound {
      font-size: 0.8125rem; font-weight: 550; color: #f3f4fa; background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-line); border-radius: 6px; padding: 0.1rem 0.6rem; cursor: pointer;
    }
    .mb-sound:hover, .mb-sound:focus-visible { background: rgba(255, 255, 255, 0.18); }

    /* ── Desktop ── */
    .desktop { position: relative; flex: 1 1 auto; overflow: hidden; }

    .desk-icons {
      position: absolute; left: 0.5rem; top: 0.75rem; bottom: 0.75rem;
      display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 0.6rem;
    }
    .desk-icon {
      width: 5.5rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      padding: 0.4rem 0.2rem; border-radius: 8px; color: #fff;
    }
    .desk-icon img {
      width: 3rem; height: 3rem; border-radius: 0.75rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    .desk-icon-label {
      font-size: 0.8125rem; font-weight: 600; line-height: 1.2; text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .desk-icon:hover { background: rgba(255, 255, 255, 0.12); }

    /* ── Windows ── */
    .win {
      position: absolute;
      display: flex; flex-direction: column;
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      overflow: clip; /* never scrolled by a focus() inside it */
      transition: box-shadow 160ms ease;
      animation: winOpen 180ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes winOpen { from { opacity: 0; transform: scale(0.97) translateY(6px); } }
    .win[hidden] { display: none; }
    .win.focused { box-shadow: var(--shadow-lg); }
    .win.dragging { transition: none; }
    .win.flash { animation: winFlash 700ms ease-out 2; }
    @keyframes winFlash {
      0%, 100% { box-shadow: var(--shadow-lg); }
      45% { box-shadow: var(--shadow-lg), 0 0 0 3px var(--pink); }
    }

    .win-bar {
      position: relative;
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 0.55rem;
      height: 2.5rem;
      padding: 0 0.25rem 0 0.75rem;
      background: linear-gradient(#f8f9fc, #eceff4);
      border-bottom: 1px solid #d5d9e2;
      cursor: default; touch-action: none;
    }
    .win.focused .win-bar::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: var(--brand-grad);
    }
    .win-icon { width: 1.25rem; height: 1.25rem; border-radius: 5px; flex: 0 0 auto; }
    .win-title { font-family: var(--font-display); font-size: 0.875rem; font-weight: 650; }
    .win:not(.focused) .win-title { color: var(--text-muted); }
    .win:not(.focused) .win-icon { opacity: 0.7; }
    .win-btns { margin-left: auto; display: flex; gap: 0.15rem; }
    .win-btn {
      width: 2.1rem; height: 1.8rem; display: grid; place-items: center;
      color: var(--text-muted); border-radius: 6px; font-size: 1rem;
    }
    .win-btn:hover { background: rgba(20, 26, 50, 0.08); color: var(--text); }
    .win-close:hover { background: #e0364f; color: #fff; }
    .win-btn svg { display: block; }
    .win-body { flex: 1 1 auto; min-height: 0; display: flex; }
    .win-grip {
      position: absolute; right: 0; bottom: 0; width: 0.9rem; height: 0.9rem;
      cursor: nwse-resize; touch-action: none; color: #a3a9b8;
    }

    /* ── List / detail apps ── */
    .app { display: flex; width: 100%; min-height: 0; }
    .app-list {
      flex: 0 0 40%; max-width: 14rem; min-width: 8rem;
      overflow-y: auto;
      border-right: 1px solid var(--hairline);
      background: var(--bg-alt);
      padding: 0.35rem;
    }
    .app-row {
      display: block; width: 100%; text-align: left; position: relative;
      padding: 0.5rem 0.6rem 0.5rem 1.1rem;
      border-radius: 7px;
      color: var(--text);
    }
    .app-row + .app-row { margin-top: 2px; }
    .app-row:hover { background: rgba(20, 26, 50, 0.05); }
    .app-row.selected { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 38%, var(--surface)); }
    .app-row.selected .app-row-title { font-weight: 750; }
    .app-row.unread::before {
      content: ""; position: absolute; left: 0.4rem; top: 0.95em;
      width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--accent);
    }
    .app-row-title { display: block; font-weight: 650; font-size: 0.9375rem; line-height: 1.3; }
    .app-row.unread .app-row-title { font-weight: 750; }
    .app-row-sub {
      display: block; font-size: 0.8125rem; color: var(--text-muted);
      margin-top: 0.1rem; font-variant-numeric: tabular-nums;
    }

    .app-list::-webkit-scrollbar, .app-detail::-webkit-scrollbar, .ho-list::-webkit-scrollbar, .ho-draft::-webkit-scrollbar { width: 0.7rem; }
    .app-list::-webkit-scrollbar-track, .app-detail::-webkit-scrollbar-track, .ho-list::-webkit-scrollbar-track, .ho-draft::-webkit-scrollbar-track { background: transparent; }
    .app-list::-webkit-scrollbar-thumb, .app-detail::-webkit-scrollbar-thumb, .ho-list::-webkit-scrollbar-thumb, .ho-draft::-webkit-scrollbar-thumb {
      background: #c4c9d4; border-radius: 0.35rem; border: 2px solid transparent; background-clip: padding-box;
    }
    .app-pane { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .app-detail { flex: 1 1 auto; overflow-y: auto; padding: 0.9rem 1rem; user-select: text; }
    .app-detail h2 {
      font-family: var(--font-display); font-size: 1.125rem; font-weight: 750;
      line-height: 1.25;
    }
    .app-sub {
      font-size: 0.8125rem; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin: 0.15rem 0 0.75rem;
      padding-bottom: 0.6rem; border-bottom: 1px solid var(--hairline);
    }
    .app-body { font-size: 1rem; line-height: 1.6; max-width: 68ch; white-space: pre-line; }
    .app-fields {
      display: grid; grid-template-columns: auto 1fr; gap: 0 1rem;
      margin-bottom: 0.75rem; font-size: 0.9375rem;
      background: var(--bg-alt); border: 1px solid var(--hairline); border-radius: 8px;
      padding: 0.25rem 0.75rem;
    }
    .app-fields dt {
      font-size: 0.8125rem; font-weight: 700; color: var(--text-muted);
      padding: 0.4rem 0; border-bottom: 1px solid var(--hairline);
    }
    .app-fields dd {
      font-weight: 600; font-variant-numeric: tabular-nums;
      padding: 0.35rem 0; border-bottom: 1px solid var(--hairline);
    }
    .app-fields dt:nth-last-of-type(1), .app-fields dd:last-child { border-bottom: 0; }
    .app-note {
      width: 100%; min-height: 8rem; resize: none;
      border: 1px solid var(--hairline-strong); border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font: inherit; font-size: 1rem; line-height: 1.7;
      color: var(--text); background: #fffdf3;
    }
    .app-note:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .app-foot {
      flex: 0 0 auto; padding: 0.35rem 1rem;
      border-top: 1px solid var(--hairline); background: var(--bg-alt);
      font-size: 0.8125rem; font-weight: 600; color: var(--text-muted);
    }
    .app-foot:empty { display: none; }

    /* ── Notifications ── */
    .toasts {
      position: fixed; bottom: calc(var(--dock-h) + 0.75rem); right: calc(var(--side-w, 0px) + 1.75rem);
      width: 19rem; display: flex; flex-direction: column; gap: 0.5rem;
      pointer-events: none;
      z-index: 6000;
    }
    .toast {
      pointer-events: auto;
      position: relative; overflow: hidden;
      background: rgba(255, 255, 255, 0.97);
      color: var(--text);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 0.6rem 0.75rem 0.8rem;
      cursor: pointer;
      --slip-ink: var(--accent);
      animation: toastIn 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .toast-urgent { --slip-ink: var(--error); background: color-mix(in oklab, var(--error) 9%, #fff); }
    .toast-urgent .toast-title { font-weight: 800; }
    .toast.leaving { opacity: 0; transform: translateX(0.6rem); transition: all 200ms ease-in; }
    .toast-head { display: flex; align-items: center; gap: 0.4rem; }
    .toast-icon { width: 1.1rem; height: 1.1rem; border-radius: 4px; }
    .toast-app { font-size: 0.8125rem; font-weight: 650; color: var(--text-muted); }
    .toast-dismiss {
      margin-left: auto; width: 1.5rem; height: 1.5rem; display: grid; place-items: center;
      color: var(--text-muted); border-radius: 50%;
    }
    .toast-dismiss:hover { color: #fff; background: var(--error); }
    .toast-title { font-family: var(--font-display); font-size: 0.9375rem; font-weight: 700; line-height: 1.3; margin-top: 0.25rem; }
    .toast-body { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.15rem; line-height: 1.45; }
    .toast-life { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--hairline); }
    .toast-life i { display: block; height: 100%; width: calc(var(--life, 1) * 100%); background: var(--slip-ink); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(1rem); } }

    /* ── Dock ── */
    .dock-wrap {
      flex: 0 0 var(--dock-h);
      display: flex; align-items: center; justify-content: center;
      z-index: 4000;
    }
    .dock {
      display: flex; align-items: flex-end; gap: 0.35rem;
      padding: 0.4rem 0.6rem 0.35rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--glass-line);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .dock-btn {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      min-width: 4.6rem; padding: 0.3rem 0.35rem 0.45rem;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.86);
      transition: background 120ms ease, transform 140ms ease;
    }
    .dock-btn:hover { background: rgba(255, 255, 255, 0.10); }
    .dock-btn:hover .dock-icon { transform: translateY(-3px); }
    .dock-icon {
      width: 2.6rem; height: 2.6rem; border-radius: 0.7rem;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      transition: transform 140ms ease;
    }
    .dock-label { font-size: 0.8125rem; font-weight: 600; white-space: nowrap; }
    .dock-btn.focused { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .dock-dot {
      position: absolute; bottom: 0.1rem; left: 50%; width: 0.3rem; height: 0.3rem; margin-left: -0.15rem;
      border-radius: 50%; background: transparent;
    }
    .dock-btn.running .dock-dot { background: rgba(255, 255, 255, 0.85); }
    .dock-btn.focused .dock-dot { background: var(--orange); }
    .dock-badge {
      position: absolute; top: 0; right: 0.55rem;
      min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem;
      display: none; place-items: center;
      background: var(--pink-ink); color: #fff;
      font-size: 0.8125rem; font-weight: 750; font-variant-numeric: tabular-nums;
      border-radius: 999px; box-shadow: 0 0 0 2px rgba(14, 17, 40, 0.8);
    }
    .dock-btn.has-badge .dock-badge { display: grid; }

    /* ── The handoff app: a message being written ── */
    .app-handoff {
      flex-direction: column; position: relative; background: var(--surface); overflow: clip;
      container: handoff / size; /* the layout follows the window, not the screen */
    }
    .ho-shell { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .ho-pool { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    .ho-head {
      flex: 0 0 auto;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--hairline);
      background: linear-gradient(100deg, color-mix(in oklab, var(--pink) 9%, var(--surface)), color-mix(in oklab, var(--orange) 7%, var(--surface)));
    }
    .ho-prompt { font-size: 1rem; font-weight: 550; line-height: 1.5; max-width: 62ch; }

    .ho-section-label {
      font-size: 0.8125rem; font-weight: 750;
      color: var(--text-muted);
    }
    .ho-draft {
      position: relative; flex: 0 1 auto; max-height: 56%; overflow-y: auto;
      padding: 0.6rem 1rem 0.5rem;
    }
    .ho-draft > .ho-section-label { margin-bottom: 0.4rem; }
    .ho-slots { list-style: none; }
    .ho-slot {
      border: 1px solid var(--hairline-strong); border-radius: 9px;
      padding: 0.45rem 0.4rem 0.45rem 0.55rem;
      margin-bottom: 0.4rem; background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .ho-slot.empty { border-style: dashed; box-shadow: none; background: var(--bg-alt); min-height: 2.4rem; }
    .ho-slot-main { display: flex; align-items: flex-start; gap: 0.6rem; }
    .ho-slot-n {
      flex: 0 0 auto; width: 1.45rem; height: 1.45rem; margin-top: 0.05rem;
      display: grid; place-items: center; border-radius: 50%;
      font-size: 0.8125rem; font-weight: 750;
      background: var(--brand-ink-grad); color: #fff;
    }
    .ho-slot.empty .ho-slot-n { background: var(--surface-alt); color: var(--text-muted); }
    .ho-slot-text { flex: 1 1 auto; font-size: 1rem; line-height: 1.45; font-weight: 550; padding-top: 0.05rem; }
    .ho-slot.empty .ho-slot-text { color: var(--text-muted); font-weight: 400; font-size: 0.875rem; }
    .ho-slot-drop {
      flex: 0 0 auto; color: var(--text-muted);
      width: 1.6rem; height: 1.6rem; display: grid; place-items: center; border-radius: 6px;
    }
    .ho-slot-drop:hover { color: #fff; background: var(--error); }
    .ho-slot-evidence {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem;
      margin: 0.4rem 0 0.1rem 2.05rem;
    }
    .ho-chip {
      display: inline-flex; align-items: center; gap: 0.2rem;
      background: var(--success-soft); color: color-mix(in oklab, var(--success) 80%, #000);
      border: 1px solid color-mix(in oklab, var(--success) 35%, var(--surface));
      border-radius: 999px; padding: 0.12rem 0.2rem 0.12rem 0.65rem;
      font-size: 0.875rem; font-weight: 600;
    }
    .ho-chip-x {
      width: 1.35rem; height: 1.35rem; display: grid; place-items: center; border-radius: 50%;
      color: inherit;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

   reload brings it back, so reload by itself, a little later each time: at most 4 times in a row, then say so on the page.
   window.__loadRetry(what) does the same for a failed import(); it returns true when the page is reloading. */
(function(){var k='load-retry:'+location.pathname,n=0,s,busy=0;try{s=sessionStorage;n=+s.getItem(k)||0}catch(_){}
var retry=window.__loadRetry=function(what){if(busy)return true;busy=1;
if(s&&n<4){s.setItem(k,n+1);setTimeout(function(){location.reload()},300*(n+1));return true}
console.error('[load] '+what+' did not load. Reload the page.');var d=document.createElement('div');d.setAttribute('role','alert');
d.textContent='Part of this page did not load. Reload the page.';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:2147483647;padding:12px;background:#fff;color:#111;font:600 16px/1.3 system-ui,sans-serif;text-align:center';
(document.body||document.documentElement).appendChild(d);try{s&&s.removeItem(k)}catch(_){}return false};
addEventListener('error',function(e){var t=e.target;if(t&&(t.tagName==='SCRIPT'||t.tagName==='LINK'&&/stylesheet|modulepreload/.test(t.rel)))retry(t.src||t.href||'a script')},true);
addEventListener('load',function(){setTimeout(function(){try{busy||s&&s.removeItem(k)}catch(_){}},5000)})})();

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Scale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 2v11M3.5 14h9M2 4.5h12' stroke='%23C99A4B' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M2 5 0.5 9h3zM14 5l-1.5 4h3z' fill='%23C99A4B'/%3E%3C/svg%3E">
<style>
  /* Fonts ship in the package (SIL OFL). No network at play time. */
  @font-face{font-family:"Cinzel";src:url(./assets/fonts/Cinzel_600.woff2) format("woff2");font-weight:600}
  @font-face{font-family:"Crimson Pro";src:url(./assets/fonts/Crimson-Pro_400.woff2) format("woff2");font-weight:400 600}
  /* One type scale, in rem so it grows with --ui on big screens: 2 titles, 1.375 headings, 1.0625 body and controls.
     Three text colors: cream, muted, and ink on brass. The names on the weights all share one
     size, --wf, which the camera sets so a name always fills the same share of its weight. */
  :root{ --paper:#EEE4CC; --rule:#CDBD98; --cream:#EFE3C6; --muted:#C2B89F; --ink:#181410; --brass:#C99A4B; --brass-hi:#E6C47E; --brass-lo:#B98A40; --brass-edge:#5F4415;
    --red:#8E2018; --bg:#0A0907; --panel:#1B1814; --line:#3C352B; --line-hi:#5A4D3A; --ring:#F3D58F; --ui:1; --wf:15px }
  html{font-size:calc(16px * var(--ui))}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--bg)}
  body{overflow:auto;color:var(--cream);font-family:"Crimson Pro",Georgia,serif;font-weight:400;font-size:1.0625rem;line-height:1.45;-webkit-font-smoothing:antialiased}
  ::selection{background:#6b5226;color:var(--cream)}
  :focus-visible{outline:3px solid var(--ring);outline-offset:3px}
  body.mouse :focus-visible{outline:none}
  [tabindex="-1"]:focus{outline:none}
  b,strong{font-weight:600}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* the stage: below 1168x657 the page scrolls, so the names on the weights never drop under 13px */
  #stage{position:relative;width:100%;height:100%;min-width:1168px;min-height:657px;overflow:hidden;user-select:none}
  #app,#app canvas{position:absolute;left:0;top:0;display:block}

  /* the names on the weights: page text laid over each face, so it stays sharp at any size */
  #labels{position:absolute;inset:0;z-index:5;pointer-events:none}
  .wb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:0;border:0;
    border-radius:.25em;background:transparent;cursor:pointer;font:600 var(--wf)/1.15 "Crimson Pro",Georgia,serif;color:var(--cream);
    white-space:nowrap;transition:box-shadow .12s}
  .wb:hover,.wb.hot{box-shadow:0 0 0 3px var(--brass-hi),0 0 0 5px #241806,0 8px 18px rgba(0,0,0,.6)}
  .wb[hidden],.new[hidden]{display:none}
  #labels[inert] .wb{cursor:default;box-shadow:none}
  /* while the committee weighs, the weights on the need it checks are ringed */
  #labels[inert] .wb.on{box-shadow:0 0 0 2px var(--brass-hi)}
  .wb.dim{color:var(--muted)}
  .new{position:absolute;pointer-events:none;transform:translate(-50%,-50%);padding:0 .45rem;border-radius:.25rem;background:var(--red);
    color:var(--cream);font-weight:600;line-height:1.45;box-shadow:0 2px 6px rgba(0,0,0,.6)}

  /* plates show; buttons press. A plate is flat, a button is raised and moves under the pointer. */
  .plate{background:rgba(20,17,13,.94);border:1px solid var(--line);border-radius:.4rem;color:var(--cream)}
  .btn{font:600 1.0625rem/1.2 "Crimson Pro",Georgia,serif;color:var(--cream);cursor:pointer;padding:.7rem 1.3rem;border-radius:.4rem;
    border:1px solid var(--line-hi);background:linear-gradient(180deg,#40382d,#29231c);white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,240,210,.16),0 3px 0 #0e0b08,0 8px 16px rgba(0,0,0,.5);transition:transform .08s,background .15s,box-shadow .08s}
  .btn:hover{background:linear-gradient(180deg,#52473a,#332b22);transform:translateY(-1px)}
  .btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,240,210,.1),0 1px 0 #0e0b08,0 3px 8px rgba(0,0,0,.5)}
  .btn.brass{color:var(--ink);border-color:#f0d69a;background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 var(--brass-edge),0 10px 18px rgba(0,0,0,.55)}
  .btn.brass:hover{background:linear-gradient(180deg,#f2d699,#c89749)}
  .btn.big{font-size:1.375rem;padding:.8rem 1.8rem}
  .btn:disabled{cursor:default;transform:none;filter:saturate(.3) brightness(.6)}

  /* the corners: sound top left, the meeting notes bottom left, how many are used and Present bottom right */
  #top{position:absolute;left:1rem;top:1rem;z-index:10}
  /* the title plate over the scale: the client, then the meeting */
  #sign{position:absolute;left:50%;top:1rem;transform:translateX(-50%);z-index:9;text-align:center;padding:.55rem 1.6rem;max-width:calc(100% - 20rem)}
  #signTitle{font-size:1.375rem;font-weight:600;line-height:1.3}
  #signSub{color:var(--muted);line-height:1.4}
  #bottom{position:absolute;left:1rem;right:1rem;bottom:1rem;z-index:10;display:flex;gap:.75rem;align-items:flex-end;pointer-events:none}
  #bottom>*{pointer-events:auto}
  #bottom.off{visibility:hidden}
  #status{margin-left:auto;padding:.7rem 1.1rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
  #status b{color:var(--cream)}

  /* the committee's reasons while the scale weighs, docked over the rack */
  #dock{position:absolute;right:1rem;top:6.5rem;z-index:10;width:25rem;max-height:calc(100% - 7.5rem);overflow:auto;padding:1.1rem 1.4rem 1.3rem;border-radius:.6rem;
    background:var(--panel);border:1px solid var(--line-hi);box-shadow:0 20px 44px rgba(0,0,0,.65);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
  #dock.on{opacity:1;visibility:visible;transition:opacity .25s}
  /* "Need 2 of 5" and Skip share a line; the client's words run the full width under them */
  .dkHead{display:flex;gap:1rem;align-items:center;justify-content:space-between}
  #dkPri{color:var(--muted)}
  #skip{padding:.45rem 1rem;flex:none}
  #dkTitle{margin-top:.5rem;font-style:italic;font-weight:400;font-size:1.0625rem;line-height:1.45}
  #dkWho{color:var(--muted);margin-top:.35rem}
  #dkNote p{margin-top:.6rem}
  #dkNote .tie{font-weight:600;font-size:1.375rem;color:var(--muted)}
  .reqs{width:100%;border-collapse:collapse;margin-top:.8rem}
  .reqs th{font-weight:600;color:var(--muted);padding:0 0 .3rem;text-align:left}
  .reqs th.ic,.reqs td.ic{width:1%;white-space:nowrap;text-align:center;padding-left:.75rem}
  .reqs td{padding:.38rem 0;border-top:1px solid var(--line);vertical-align:middle;line-height:1.35}
  .reqs td.ic svg{display:block;margin:0 auto;width:1.35rem;height:1.35rem}
  .reqs tfoot th,.reqs tfoot td{border-top:1px solid var(--line-hi);padding-top:.4rem;font-size:1.375rem;font-weight:600;color:var(--cream);font-variant-numeric:tabular-nums}
  .reqs tfoot th{font-size:1.0625rem}

  /* cards */
  .ov{position:fixed;inset:0;z-index:20;display:flex;align-items:safe center;justify-content:safe center;padding:1rem;overflow:auto;
    background:rgba(6,5,4,.8);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
  .ov.on{opacity:1;visibility:visible;transition:opacity .25s}
  .card{width:min(var(--cw,40rem),100%);flex:none;padding:1.7rem 2.1rem 1.9rem;border-radius:.7rem;background:var(--panel);border:1px solid var(--line-hi);
    box-shadow:0 30px 60px rgba(0,0,0,.8)}
  .card h1{font-size:2rem;font-weight:600;line-height:1.15}
  .cin{font-family:"Cinzel",Georgia,serif;letter-spacing:.03em}
  .card h2{font-size:1.375rem;font-weight:600;line-height:1.3;margin-top:1.1rem}
  .card p{margin-top:.5rem;max-width:68ch}
  .sub{color:var(--muted)}
  .row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:1.4rem}
  .row .flat{margin:0 0 0 .5rem}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 2.4rem}
  .needs{display:grid;grid-template-columns:repeat(var(--nc,3),minmax(0,1fr));gap:.9rem 1.8rem;margin-top:.9rem}
  .need{border-top:1px solid var(--line-hi);padding-top:.6rem}
  .need h2{font-size:1.375rem;font-weight:600;line-height:1.3;margin-top:0}
  .need .pri{color:var(--muted)}
  .need .said{margin-top:.4rem;font-style:italic;line-height:1.45}
  .tally{width:100%;border-collapse:collapse;margin-top:.9rem;font-variant-numeric:tabular-nums}
  .tally th{font-weight:600;color:var(--muted);text-align:right;padding:0 0 .3rem .9rem;white-space:nowrap}
  .tally th:first-child{text-align:left;padding-left:0}
  .tally td{padding:.36rem 0 .36rem .9rem;border-top:1px solid var(--line);text-align:right;white-space:nowrap;line-height:1.35}
  .tally td:first-child{text-align:left;padding-left:0;white-space:normal}
  .tally caption{text-align:left;color:var(--muted);padding-bottom:.2rem}

  /* results: the whole screen, nothing of the scale behind it */
  #results{position:fixed;inset:0;z-index:30;overflow:auto;display:flex;justify-content:safe center;align-items:safe center;padding:1.5rem 2.5rem;
    background:radial-gradient(ellipse at 50% 0%,#211a12,var(--bg) 70%);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
  #results.on{opacity:1;visibility:visible;transition:opacity .4s}
  #results .wrap{width:min(84rem,100%);flex:none}
  #results h1{font-size:2rem;font-weight:600;line-height:1.15}
  #rsSub{margin-top:.35rem;color:var(--muted)}
  /* one column per side: its total over the needs it took; ties and features nobody asked for are muted */
  .sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 4rem;margin-top:1.5rem}
  .sides .top{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:.75rem;border-bottom:2px solid var(--brass)}
  .sides .them .top{border-bottom-color:#6E7C8C}
  .sides .top b{font-size:1.375rem;line-height:1.3}
  .sides .n{font-family:"Cinzel",Georgia,serif;font-size:4.5rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--brass-hi)}
  .sides .them .n{color:var(--cream)}
  .sides ul{list-style:none}
  .sides li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 1.5rem;align-items:baseline;padding:.7rem 0;border-bottom:1px solid var(--line)}
  .sides li i{grid-column:1/-1;color:var(--muted);margin-top:.15rem;max-width:68ch}
  .sides .m{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sides .p{font-weight:600;font-variant-numeric:tabular-nums}
  .sides li.minus,.sides li.minus .p{color:var(--muted)}
  #rsFoot{display:flex;gap:2rem;justify-content:space-between;align-items:center;margin-top:1.6rem;padding-top:1.2rem;border-top:1px solid var(--line)}
  .tabs{display:grid;grid-template-columns:repeat(var(--rc,3),minmax(0,1fr));gap:.6rem;margin-top:1.3rem}
  .tab{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;white-space:normal;padding:.6rem 1rem}
  .tab span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .tab[aria-selected="true"]{background:linear-gradient(180deg,#5a4c37,#3b3125);border-color:var(--brass)}
  .tab[aria-selected="true"] span{color:var(--cream)}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:.6rem;right:.6rem;bottom:-.55rem;height:3px;border-radius:2px;background:var(--brass-hi)}
  .tabs+.panel{margin-top:1.2rem}
  #err{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#400;color:#fdd;font:13px/1.4 monospace;padding:8px;white-space:pre-wrap;display:none}
  /* a window under the stage's width: the cards read in one column and scroll */
  @media (max-width:900px){ .cols,.sides{grid-template-columns:minmax(0,1fr)} .log p{grid-template-columns:minmax(0,1fr);gap:0} .cols{row-gap:1rem} .tabs{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (prefers-reduced-motion:reduce){ .ov,.ov.on,#dock,#dock.on,#results,#results.on{transition:none} .btn{transition:none} }
  /* the committee goes down the list one requirement at a time: each row lights and its marks pop in */
  .reqs tbody tr td{opacity:.35;transition:opacity .25s}
  .reqs tbody tr td.ic svg{transform:scale(0);transition:transform .28s cubic-bezier(.16,1,.3,1)}
  .reqs tbody tr.on td{opacity:1}
  .reqs tbody tr.on td.ic svg{transform:scale(1)}
  .reqs th,.reqs td{transition:opacity .35s,color .35s}
  /* then the side that meets more lights up, and the other side fades */
  .reqs.w-us #dkHUs,.reqs.w-us #dkUs,.reqs.w-them #dkHThem,.reqs.w-them #dkThem{color:var(--brass-hi)}
  .reqs.w-us #dkHThem,.reqs.w-us #dkThem,.reqs.w-them #dkHUs,.reqs.w-them #dkUs{color:var(--muted)}
  .reqs.w-us tbody td:nth-child(2) svg,.reqs.w-them tbody td:nth-child(3) svg{opacity:.3}
  .reqs.w-us #dkUs,.reqs.w-them #dkThem{font-size:2rem}

  /* the meeting notes: a typed record on paper */
  .sheet{width:min(56rem,100%);flex:none;padding:2.4rem 3.4rem 2rem;border-radius:.2rem;background:var(--paper);color:var(--ink);
    box-shadow:0 18px 40px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.4);transform:rotate(-.4deg)}
  .sheet h1{font-size:2rem;font-weight:600;line-height:1.2}
  .sheet .meta{margin-top:.25rem}
  .log{margin-top:1.1rem;border-top:1px solid var(--rule)}
  .log p{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1.2rem;padding:.55rem 0;line-height:1.45}
  .log p b{font-weight:600}
  .sheet .foot{display:flex;gap:1rem;align-items:center;justify-content:flex-end;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--rule)}
  .sheet .foot p{margin-right:auto}
  .sheet ::selection{background:#d9c08a;color:var(--ink)}

  /* the weight card and the confirm card */
  #icTitle,#cfTitle,#howTitle{font-size:1.375rem;line-height:1.3}
  /* the briefing memo: the same paper as the meeting notes */
  .memo{width:min(42rem,100%)}
  .memo .hdr{padding-bottom:.9rem;margin-bottom:1.4rem;border-bottom:1px solid var(--rule)}
  .memo .hdr p{display:grid;grid-template-columns:5rem minmax(0,1fr);padding:.1rem 0}
  .memo #inBody p{margin-top:.75rem;max-width:36rem}
  .memo .foot{margin-top:1.6rem}
  #howList{list-style:none;margin-top:.75rem}
  #howList li{padding:.5rem 0;border-top:1px solid var(--line)}
  #cfList{list-style:none;margin-top:.75rem}
  #cfList li{padding:.5rem 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="stage">
  <div id="app"></div>
  <header id="top">
    <button id="sound" class="btn" type="button">Sound on</button>
  </header>
  <div id="sign" class="plate"><h1 id="signTitle" tabindex="-1">The Scale</h1><p id="signSub"></p></div>
  <div id="labels"></div>
  <div id="bottom">
    <button id="btnNeeds" class="btn" type="button">Meeting notes</button>
    <div id="status" class="plate"></div>
    <button id="weigh" class="btn brass big" type="button" disabled>Present</button>
  </div>
  <aside id="dock" aria-labelledby="dkTitle">
    <div class="dkHead"><p id="dkPri"></p><button id="skip" class="btn" type="button">Skip</button></div>
    <h2 id="dkTitle"></h2>
    <p id="dkWho"></p>
    <table class="reqs" id="dkTable"><thead><tr><th scope="col">Requirement</th><th scope="col" class="ic" id="dkHThem"></th><th scope="col" class="ic" id="dkHUs"></th></tr></thead>
      <tbody id="dkRows"></tbody><tfoot><tr><th scope="row">Meets</th><td class="ic" id="dkThem"></td><td class="ic" id="dkUs"></td></tr></tfoot></table>
    <div id="dkNote"></div>
    
  </aside>
</div>
<div id="sr" class="vh" role="status" aria-live="polite"></div>

<div class="ov on" id="intro"><div class="sheet memo" role="dialog" aria-modal="true" aria-labelledby="inTitle">
  <div class="hdr"><p><b>To</b><span>You</span></p><p><b>From</b><span id="inFrom"></span></p><p><b>About</b><span id="inAbout"></span></p></div>
  <h1 class="cin" id="inTitle"></h1>
  <div id="inBody"></div>
  <div class="foot"><button id="howBtn" class="btn" type="button">How to play</button><button id="start" class="btn brass big" type="button">Go to the meeting</button></div>
</div></div>

<div class="ov" id="how"><div class="card" style="--cw:36rem" role="dialog" aria-modal="true" aria-labelledby="howTitle">
  <h1 id="howTitle">How to play</h1>
  <ul id="howList"></ul>
  <div class="row"><button class="btn" type="button" data-close>Close</button></div>
</div></div>

<div class="ov" id="needsCard"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ndTitle">
  <h1 class="cin" id="ndTitle"></h1>
  <p class="meta" id="ndSub"></p>
  <div class="log" id="ndLog"></div>
  <div class="foot"><p id="ndNew"></p><button id="ndGo" class="btn" type="button"></button></div>
</div></div>

<div class="ov" id="itemCard"><div class="card" style="--cw:36rem" role="dialog" aria-modal="true" aria-labelledby="icTitle">
  <h1 id="icTitle"></h1>
  <p class="sub" id="icFrom"></p>
  <p id="icDoes"></p>
  <p class="sub" id="icNew"></p>
  <div class="row"><button id="icAct" class="btn brass" type="button"></button><button class="btn" type="button" data-close>Close</button><span class="sub" id="icFull"></span></div>
</div></div>

<div class="ov" id="confirm"><div class="card" style="--cw:34rem" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
  <h1 id="cfTitle"></h1>
  <ul id="cfList"></ul>
  <p class="sub" id="cfBody"></p>
  <div class="row"><button id="cfYes" class="btn brass" type="button">Present</button><button id="cfNo" class="btn" type="button">Back</button></div>
</div></div>

<div class="ov" id="summary"><div class="card" style="--cw:44rem" role="dialog" aria-modal="true" aria-labelledby="smTitle">
  <h1 class="cin" id="smTitle"></h1>
  <p id="smScore"></p>
  <table class="tally" id="smTable"></table>
  <div id="smNotes"></div>
  <p id="smDeal"></p>
  <div class="row"><button id="smGo" class="btn brass big" type="button"></button></div>
</div></div>

<section id="results" aria-labelledby="rsTitle"><div class="wrap">
  <h1 class="cin" id="rsTitle" tabindex="-1"></h1>
  <p id="rsSub"></p>
  <div class="tabs" role="tablist" id="rsTabs" aria-label="Meetings"></div>
  <div class="panel" id="rsPanel" role="tabpanel" tabindex="0"></div>
  <div id="rsFoot"><p id="rsPicks"></p><button id="startOver" class="btn" type="button">Start over</button></div>
</div></section>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "scorm": "./scorm.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { connectScorm } from 'scorm';
import { createAudio } from './assets/audio/audio.js';
import defaultContent from './content.js';
import { validatePack } from './validate-pack.mjs';
import { makeScoring, nameLines, NAME_FIT } from './scoring.mjs';

const $ = id => document.getElementById(id);

/*═══════════════════════════════════════════════════════════════════════════
  BALANCE — column, beam, two hanging pans. Each pan hangs from a beam end on
  chains up its two ends, so the weights stack between the chains. The rival's
  pan is on the left. The beam tips toward the heavier pan as each weight
  lands or comes off.
═══════════════════════════════════════════════════════════════════════════*/
const SC = { x:-2.2, A:2.45, pivotY:3.5, yP:.72, panR:1.65, maxTilt:.1 };
// the spreader sits just over the tallest stack any meeting can build, so the chains above it make the old triangle
SC.spread=(()=>{ const H={ 1:.44, 2:.58, 3:.74 }, need=id=>CONTENT.rounds.flatMap(R=>R.needs).find(n=>n.id===id);
  let top=0;
  for(const R of CONTENT.rounds){ const sides=[R.rival.map(r=>H[need(r.need).priority]), R.items.filter(i=>i.need).map(i=>H[need(i.need).priority]).sort((a,b)=>b-a).slice(0,R.slots)];
    for(const hs of sides){ const c=[0,0]; for(const h of hs.sort((a,b)=>b-a)) c[c[0]<=c[1]?0:1]+=h; top=Math.max(top, ...c); } }
  return Math.min(Math.max(top+.3, 1.3), 2.45); })();
const COLX=[-.78,.78];   // the two stacks on each pan
(function column(){
  const {x,pivotY}=SC;
  box(1.5,.14,1.0,M.brassD,x,.07,0);
  const foot=cyl(.62,.1,M.brass,40); foot.position.set(x,.16,0); scene.add(foot);
  const step=cyl(.44,.12,M.brassD,32); step.position.set(x,.26,0); scene.add(step);
  const shaft=cyl(.115,pivotY-.3,M.brass,24); shaft.position.set(x,.3+(pivotY-.3)/2,0); scene.add(shaft);
  for(const y of [1.0,2.1]){ const c=new THREE.Mesh(new THREE.TorusGeometry(.15,.028,10,28),M.brassD); c.rotation.x=Math.PI/2; c.position.set(x,y,0); scene.add(c); }
  const cap=cyl(.2,.16,M.brassD,24); cap.position.set(x,pivotY-.1,0); scene.add(cap);
})();
const BEAM = new THREE.Group(); BEAM.position.set(SC.x, SC.pivotY, 0); scene.add(BEAM);
(function beam(){
  const a=SC.A;
  box(a*2,.1,.13,M.brass,0,0,0,BEAM);
  for(const s of [-1,1]){ const t=new THREE.Mesh(new THREE.ConeGeometry(.08,.34,4),M.brass); t.rotation.z=s*Math.PI/2; t.position.set(s*(a+.14),0,0); BEAM.add(t); }
  const boss=new THREE.Mesh(new THREE.SphereGeometry(.2,20,14),M.brass); BEAM.add(boss);
  box(.055,.5,.05,M.brassD,0,.32,0,BEAM);
  for(let i=-4;i<=4;i++) box(.05,.05,.05,M.brassD,i*.55,.07,.07,BEAM);
  BEAM.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
})();
// a chain link between two points, in the pan's own frame
function chain(g, a, b){ const d=b.clone().sub(a), c=cyl(.012,d.length(),M.brass,6);
  c.position.copy(a).add(b).multiplyScalar(.5); c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()); g.add(c); }
function platform(s){
  const g=new THREE.Group(); scene.add(g);
  const R=SC.panR, Y=SC.spread, top=SC.pivotY-SC.yP, V=(x,y,z=0)=>new THREE.Vector3(x,y,z);
  // the brass dish, with a flat floor wide enough for two stacks
  const pts=[[0,-.03],[R*.9,-.02],[R*.985,.07],[R,.1],[R*.96,.04],[R*.88,0],[0,0]].map(([r,y])=>new THREE.Vector2(r,y));
  const dish=new THREE.Mesh(new THREE.LatheGeometry(pts,56), new THREE.MeshStandardMaterial({ map:tex('brass',1,1), color:0xD9AF5E, roughness:.34, metalness:.95, side:THREE.DoubleSide }));
  dish.castShadow=dish.receiveShadow=true; g.add(dish);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(R,.026,10,64),M.brassD); rim.rotation.x=Math.PI/2; rim.position.y=.1; g.add(rim);
  // chains up the two ends of the pan to a spreader, then in to the ring on the beam end
  const cx=R*.97;
  for(const x of [-1,1]) chain(g, V(x*cx,.1), V(x*cx,Y));
  box(cx*2+.06,.045,.05,M.brassD,0,Y,0,g);
  for(const x of [-1,1]) chain(g, V(x*cx,Y), V(0,top-.07));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.07,.017,8,20),M.brassD); ring.position.y=top; g.add(ring);
  g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  return { s, g, x:SC.x+s*SC.A, y:SC.yP, top:SC.yP, dip:0, dipV:0, cols:[[],[]] };
}

/*═══════════════════════════════════════════════════════════════════════════
  WEIGHTS — one per feature. A weight's size is its need's priority, so the
  needs that score most look heaviest.
  Every name is in the one size --wf; NAME_FIT says how many letters each size holds.
═══════════════════════════════════════════════════════════════════════════*/
const SIZE = { 1:{ w:.94, h:.44, d:.2 }, 2:{ w:1.2, h:.58, d:.26 }, 3:{ w:1.48, h:.74, d:.32 } };
const NAME_F = .14;   // the name's text size, in world units
function rrShape(w,h,r,cx=0){ const s=new THREE.Shape(), x=cx-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
const GEO = {};
const weightGeo = n => GEO['w'+n] ||= new RoundedBoxGeometry(SIZE[n].w, SIZE[n].h, SIZE[n].d, 3, .045);
const panelGeo = n => GEO['p'+n] ||= new THREE.ShapeGeometry(rrShape(SIZE[n].w-.09, SIZE[n].h-.09, .03));

const W = {}, WL = [];   // every weight; WL keeps the order their buttons sit in the page
function sizeOf(o){ if(o.kind==='rival') return NEED[o.need].priority; return o.need ? NEED[o.need].priority : 1; }
function ariaFor(w){
  if(w.kind==='rival') return `${THEM}: ${w.name}${w.isNew ? ', new' : ''}`;
  const where = w.place==='us' ? ', placed' : '';
  return `${w.name}${where}`;
}
function makeWeight(o){
  const size=sizeOf(o), g=new THREE.Group(); g.visible=false; scene.add(g);
  const S=SIZE[size], dims={ ...S };
  const body=new THREE.Mesh(weightGeo(size), (o.side==='us'?M.brass:M.iron).clone());
  const panel=new THREE.Mesh(panelGeo(size), (o.side==='us'?M.enamel:M.enamelIron).clone()); panel.position.z=S.d/2+.003;
  const lab={ x0:-S.w/2+.05, x1:S.w/2-.05, y0:-S.h/2+.05, y1:S.h/2-.05, z:panel.position.z };
  body.castShadow=body.receiveShadow=true; panel.receiveShadow=true; g.add(body, panel);
  body.material.emissive=new THREE.Color(o.side==='us'?0x7a5418:0x34404f); body.material.emissiveIntensity=0;
  const btn=document.createElement('button'); btn.type='button'; btn.className='wb'; btn.hidden=true; btn.dataset.w=o.id;
  const lines=nameLines(o.name, ...NAME_FIT[size]) || [o.name];
  btn.replaceChildren(...lines.flatMap((l,i)=>i ? [document.createElement('br'), l] : [l]));
  labelsEl.appendChild(btn);
  const w = { ...o, size, g, body, panel, dims, lab, btn, place:'hidden', col:-1, slot:-1,
    flight:null, fallV:0, glow:0, hover:false, dim:false, base:[body.material.color.clone(), panel.material.color.clone()] };
  if(o.isNew){ w.badge=document.createElement('div'); w.badge.className='new'; w.badge.textContent='New'; w.badge.hidden=true; w.badge.setAttribute('aria-hidden','true'); labelsEl.appendChild(w.badge); }
  btn.addEventListener('click', ()=>openWeight(w));
  btn.addEventListener('pointerenter', ()=>{ w.hover=true; });
  btn.addEventListener('pointerleave', ()=>{ w.hover=btn.classList.contains('hot'); });
  btn.addEventListener('focus', ()=>{ w.hover=true; btn.classList.add('hot'); });
  btn.addEventListener('blur', ()=>{ w.hover=false; btn.classList.remove('hot'); });
  W[o.id]=w; WL.push(w); return w;
}
ROUNDS.forEach((R,ri)=>{
  for(const r of R.rival) makeWeight({ id:r.id, kind:'rival', round:ri, name:r.name, need:r.need, side:'them', isNew:!!r.when });
  for(const it of R.items) makeWeight({ id:it.id, kind:'feature', round:ri, name:it.name, need:it.need, side:'us' });
});
function setDim(w, on){ if(w.dim===on) return; w.dim=on; w.btn.classList.toggle('dim', on);
  w.body.material.color.copy(w.base[0]).multiplyScalar(on?.42:1); w.panel.material.color.copy(w.base[1]).multiplyScalar(on?.7:1); }

/*═══════════════════════════════════════════════════════════════════════════
  WHERE A WEIGHT SITS — a weight stands on the one under it, so taking one
  out of a stack drops the ones above it
═══════════════════════════════════════════════════════════════════════════*/
const GRAV=16, CARRY=.55, DROP_H=.8, DROP_T=.34;
const _t=new THREE.Vector3(), _b=new THREE.Vector3(), _q=new THREE.Vector3();
const heightOf = ids => ids.reduce((s,id)=>s+W[id].dims.h, 0);
function stack(P, w){ const c = heightOf(P.cols[0]) <= heightOf(P.cols[1]) ? 0 : 1; P.cols[c].push(w.id); w.col=c; }
function unstack(w){ const P=PLAT[w.place]; if(!P) return; const col=P.cols[w.col], i=col.indexOf(w.id); if(i>=0) col.splice(i,1); }
function targetPos(w){
  const f=w.flight;
  if(w.place==='rack'){ const i=w.slot; return _t.set(RACK.cols[i%2], RACK.shelf[Math.floor(i/2)] + w.dims.h/2, RACK.z); }
  if(w.place==='them' || w.place==='us'){
    const P=PLAT[w.place]; let y=P.top;
    for(const id of P.cols[w.col]){ if(id===w.id) break; y+=W[id].dims.h; }
    return _t.set(P.x+COLX[w.col], y+w.dims.h/2, 0);
  }
  if(w.place==='off') return offPos(w);
  return _t.copy(w.g.position);
}
/* A move is a real drop: lift and carry to a point above the spot, then fall. The sound and the platform's give fire
   on the frame the weight lands, never on the click. */
function fly(w, o={}){
  w.fallV=0;
  w.flight={ kind:o.kind||'move', t:0, carry:o.carry??CARRY, dropT:o.dropT??DROP_T, arc:o.arc??.3, approach:o.approach||new THREE.Vector3(0,DROP_H,0),
    from:(o.from||w.g.position).clone(), q0:w.g.quaternion.clone(), q:o.q||null, s0:w.g.scale.clone(), s:o.s??null, ease:o.ease||easeIO,
    sound:o.sound, gain:o.gain??1, target:o.target };
  if(state.restoring) settle(w);
}
function land(w){
  const f=w.flight; w.flight=null;
  { w.g.position.copy(targetPos(w)); if(f.q) w.g.quaternion.copy(f.q); if(f.s!=null) w.g.scale.setScalar(f.s); }
  if(f.sound) sfx(f.sound, f.gain);
  if(PLAT[w.place]) PLAT[w.place].dipV -= .5+.15*w.size;
}
// finish a flight on the spot: a skip, a restore, the end of a meeting
function settle(w){ if(!w.flight) return; w.flight.sound=null; land(w); }
const easeIO=u=>u<.5 ? 4*u*u*u : 1-Math.pow(-2*u+2,3)/2;
// The committee takes a weight off: it is lifted off the pan and set down on the table in front of it, in up to two
// rows, and the weights above it settle (their landing is the sound).
const OFF = { them:[], us:[] }, OFF_X = { them:-3.95, us:.25 }, OFF_Z = [1.95, 2.5], OFF_ROW = 4;
function offPos(w){
  const list=OFF[w.side], rows=[[]]; let width=0;
  for(const id of list){ const d=W[id].dims.w+.12; if(width+d>OFF_ROW && rows.at(-1).length){ rows.push([]); width=0; } rows.at(-1).push(id); width+=d; }
  const r=Math.min(rows.findIndex(row=>row.includes(w.id)), OFF_Z.length-1), row=rows[r];
  let x=OFF_X[w.side]-(row.reduce((a,id)=>a+W[id].dims.w+.12, 0)-.12)/2;
  for(const id of row){ if(id===w.id) break; x+=W[id].dims.w+.12; }
  return _t.set(x+w.dims.w/2, TABLE.y+w.dims.h/2, OFF_Z[r]);
}
function takeOff(w){
  if(PLAT[w.place]) unstack(w);
  OFF[w.side].push(w.id); w.place='off'; fly(w, { sound:'place', gain:.5 });
}

/*═══════════════════════════════════════════════════════════════════════════
  CAMERA — it keeps one angle; the picture is cut to fit the stage the HUD
  leaves. Placing, it shows the scale and the rack. Weighing, it shows the
  scale beside the reasons.
═══════════════════════════════════════════════════════════════════════════*/
const camera = new THREE.PerspectiveCamera(30, SW/SH, .5, 90);
const CAM = { y:7.6, z:18, lookY:1.5, xPlay:0, xWeigh:SC.x };
const VIEW = {
  scale:[SC.x-SC.A-SC.panR-.12, SC.x+SC.A+SC.panR+.12, 0, SC.pivotY+.6, -SC.panR, SC.panR],
  rack: [RACK.x0-.17, RACK.x1+.17, 0, RACK.top+.1, RACK.z-.32, RACK.z+.32],   // the top board overhangs the posts .15
};
const FR = { u:0, uT:0 };   // 0 placing, 1 weighing
const HUD = { top:96, bottom:80, dock:448 };
let wfPx=0;
function bounds(list, inv){
  let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
  for(const b of list) for(const x of [b[0],b[1]]) for(const y of [b[2],b[3]]) for(const z of [b[4],b[5]]){
    _q.set(x,y,z).applyMatrix4(inv); const d=-_q.z, u=_q.x/d, v=_q.y/d;
    u0=Math.min(u0,u); u1=Math.max(u1,u); v0=Math.min(v0,v); v1=Math.max(v1,v); }
  return [u0,u1,v0,v1];
}
function frameCamera(){
  const u=FR.u, mix=(a,b)=>a+(b-a)*u;
  const x=mix(CAM.xPlay, CAM.xWeigh);
  camera.position.set(x, CAM.y, CAM.z); camera.lookAt(x, CAM.lookY, 0); camera.updateMatrixWorld();
  const inv=camera.matrixWorldInverse;
  const a=bounds([VIEW.scale, VIEW.rack], inv), b=bounds([VIEW.scale], inv);
  const [u0,u1,v0,v1]=a.map((v,i)=>mix(v,b[i]));
  const l=16, r=mix(16, HUD.dock), t=HUD.top, bt=mix(HUD.bottom, 16);
  const aw=SW-l-r, ah=SH-t-bt, s=Math.min(aw/(u1-u0), ah/(v1-v0));
  const cx=l+aw/2, cy=t+ah/2, uc=(u0+u1)/2, vc=(v0+v1)/2, n=camera.near;
  camera.projectionMatrix.makePerspective((uc-cx/s)*n, (uc+(SW-cx)/s)*n, (vc+cy/s)*n, (vc-(SH-cy)/s)*n, n, camera.far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  // one size for every name: NAME_F, seen at the scale's depth; never under 13px (at the smallest stage it is 12.9)
  _q.set(SC.x, SC.yP, 0).applyMatrix4(inv);
  const px=Math.max(13, NAME_F*s/-_q.z);
  if(Math.abs(px-wfPx)>.04){ wfPx=px; labelsEl.style.setProperty('--wf', px.toFixed(2)+'px'); }
}
const topEl=$('top'), bottomEl=$('bottom'), dockEl=$('dock');
function layout(){
  SW=stage.clientWidth; SH=stage.clientHeight;
  document.documentElement.style.setProperty('--ui', clamp(Math.min(SW/1280, SH/720), 1, 1.75).toFixed(3));
  renderer.setSize(SW, SH); measure();
}
// the room the HUD leaves for the picture; the sign can grow a line, so this runs whenever the HUD text changes
function measure(){
  const st=stage.getBoundingClientRect(), tb=topEl.getBoundingClientRect(), bb=$('weigh').getBoundingClientRect();
  HUD.top=tb.bottom-st.top+10; HUD.bottom=st.bottom-bb.top+10;
  dockEl.style.top=(tb.bottom-st.top+12)+'px'; dockEl.style.maxHeight=(st.bottom-tb.bottom-28)+'px';
  HUD.dock=dockEl.offsetWidth+32;
}
addEventListener('resize', ()=>{ layout(); });

/*═══════════════════════════════════════════════════════════════════════════
  NAMES ON THE WEIGHTS — each button is laid over its weight's face every frame
═══════════════════════════════════════════════════════════════════════════*/
function toScreen(v){ v.project(camera); return [(v.x+1)/2*SW, (1-v.y)/2*SH]; }
function labelShows(w){
  if(!w.g.visible || w.place==='hidden') return false;
  if(w.flight && w.flight.kind!=='move') return false;
  if(w.place==='rack' && state.phase!=='play' && state.phase!=='needs' && state.phase!=='intro') return false;
  return true;
}
function projectLabels(){
  for(const w of WL){
    let show=labelShows(w);
    if(show){
      const r=w.lab;
      const [x0,y0]=toScreen(w.g.localToWorld(_b.set(r.x0, r.y1, r.z)));
      const [x1,y1]=toScreen(w.g.localToWorld(_b.set(r.x1, r.y0, r.z)));
      if(x0<2 || y0<2 || x1>SW-2 || y1>SH-2) show=false;
      else { const s=w.btn.style; s.left=x0+'px'; s.top=y0+'px'; s.width=(x1-x0)+'px'; s.height=(y1-y0)+'px';
        if(w.badge){ w.badge.style.left=(x1-4)+'px'; w.badge.style.top=(y0+2)+'px'; } }
    }
    if(w.btn.hidden===show) w.btn.hidden=!show;
    if(w.badge && w.badge.hidden===show) w.badge.hidden=!show;
  }
}

/*═══════════════════════════════════════════════════════════════════════════
  CARDS
═══════════════════════════════════════════════════════════════════════════*/
const OVS=['intro','how','needsCard','itemCard','confirm','summary','results'].map($);
let lastFocus=null;
const isOn = id => $(id).classList.contains('on');
// Every card is modal: nothing behind it takes a click or a Tab.
function setModal(){
  const modal=OVS.some(o=>o.classList.contains('on'));
  for(const o of OVS) o.inert=!o.classList.contains('on');
  topEl.inert=modal;
  labelsEl.inert=modal || state.phase!=='play';
  bottomEl.inert=modal || state.phase!=='play';
  dockEl.inert=modal || state.phase!=='weigh';
}
function ov(id, on){ $(id).classList.toggle('on', on); setModal(); }
function openCard(id, from, focus){ lastFocus=from; ov(id,true); (focus || $(id).querySelector('button:not([disabled]):not([hidden])')).focus(); }
function closeCard(id){ if(!isOn(id)) return; ov(id,false); if(lastFocus && !lastFocus.hidden) lastFocus.focus(); else $('signTitle').focus(); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>closeCard(b.closest('.ov').id)));
const sr = text => { $('sr').textContent=text; };

const ICON = {
  met:`<svg viewBox="0 0 20 20" role="img" aria-label="Meets"><circle cx="10" cy="10" r="9" fill="#C99A4B"/><path d="M5.6 10.3l3 3 5.8-6.4" fill="none" stroke="#181410" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  no:`<svg viewBox="0 0 20 20" role="img" aria-label="Doesn't meet"><circle cx="10" cy="10" r="8.2" fill="none" stroke="#948a77" stroke-width="1.6"/><path d="M6.6 10h6.8" stroke="#948a77" stroke-width="1.8" stroke-linecap="round"/></svg>`,
};

// Clicking a weight opens its card. A feature on the rack can be used, a used one removed; the rival's are read.
let CARD=null, cardAt=0;
const icAct=$('icAct');
function openWeight(w){
  if(state.phase!=='play') return;
  CARD=w; cardAt=performance.now(); const R=ROUNDS[state.round];
  const set=(id, text)=>{ const el=$(id); el.textContent=text||''; el.hidden=!text; };
  set('icNew',''); set('icFull','');
  if(w.kind==='rival'){
    const r=RIVAL[w.id];
    set('icTitle', r.name); set('icFrom', r.product || CONTENT.them.product); set('icDoes', r.pitch);
    if(r.when) set('icNew', `${THEM} added this after you won ${NEED[r.when.won].name}.`);
    icAct.hidden=true;
  } else {
    const it=ITEM[w.id];
    set('icTitle', it.name); set('icFrom', it.product || CONTENT.us.product); set('icDoes', it.does);
    const on=state.placed.includes(w.id), full=!on && state.placed.length>=R.slots;
    icAct.hidden=false; icAct.textContent=on?'Remove':'Use'; icAct.disabled=full;
    if(full) set('icFull', `You've used ${R.slots} of ${R.slots}.`);
  }
  sfx('card-open', .35);
  openCard('itemCard', w.btn);
}
icAct.addEventListener('click', ()=>{ const w=CARD; closeCard('itemCard'); if(state.placed.includes(w.id)) remove(w.id); else place(w.id); });

// The meeting notes: what each person in the meeting said, in order. No need names and no priorities;
// the learner reads the client's words and works out what matters.
function openNeeds(atStart){
  const ri=state.round, R=ROUNDS[ri];
  $('ndTitle').textContent=R.name;
  $('ndSub').textContent=N>1 ? `Meeting ${ri+1} of ${N}. Notes from the meeting.` : 'Notes from the meeting.';
  $('ndLog').innerHTML=R.needs.map(n=>`<p><b>${esc(n.who)}</b><span>${esc(n.said)}</span></p>`).join('');
  $('ndNew').innerHTML=sc.rivalsIn(ri, state.won).filter(r=>r.when)
    .map(r=>`<b>New from ${esc(THEM)}:</b> ${esc(r.name)}, because you won ${esc(NEED[r.when.won].name)}.`).join(' ');
  const go=$('ndGo'); go.textContent=atStart?'Start meeting':'Close'; go.className=atStart?'btn brass big':'btn';
  sfx('sheet', .6);
  openCard('needsCard', atStart?null:$('btnNeeds'), go);
}
$('ndGo').addEventListener('click', ()=>{ if(state.phase==='needs') startMeeting(); else closeCard('needsCard'); });
$('btnNeeds').addEventListener('click', ()=>openNeeds(false));

addEventListener('keydown', e=>{ if(e.key!=='Escape') return;
  if(isOn('how')) return closeCard('how');
  if(isOn('itemCard')) return closeCard('itemCard');
  if(isOn('confirm')) return closeCard('confirm');
  if(isOn('needsCard')) return $('ndGo').click();
  if(isOn('intro')) return $('start').click(); });
// a mouse click does not leave a focus ring behind; the keyboard brings it back
addEventListener('pointerdown', ()=>document.body.classList.add('mouse'), true);
addEventListener('keydown', ()=>document.body.classList.remove('mouse'), true);

/*═══════════════════════════════════════════════════════════════════════════
  A MEETING — the rival's features drop onto the left; the learner places
═══════════════════════════════════════════════════════════════════════════*/
const weighBtn=$('weigh');
function updateHud(){
  const R=ROUNDS[state.round];
  $('signTitle').textContent=CLIENT;
  $('signSub').textContent=N>1 ? `${R.name}, ${state.round+1} of ${N}` : R.name;
  $('status').innerHTML=`<b>${state.placed.length}</b> of ${R.slots} used`;
  weighBtn.disabled = state.phase!=='play' || !state.placed.length;
  bottomEl.classList.toggle('off', state.phase!=='play' && state.phase!=='needs' && state.phase!=='intro');
  for(const w of WL) w.btn.setAttribute('aria-label', ariaFor(w));
  measure();
}
function setupRound(ri){
  // everything from the last meeting leaves the table
  for(const w of WL){
    w.flight=null; if(w.g.parent!==scene) scene.attach(w.g);
    w.g.visible=false; w.place='hidden'; w.fallV=0; w.glow=0; w.g.quaternion.identity(); w.g.scale.setScalar(1); setDim(w,false);
  }
  for(const P of Object.values(PLAT)) P.cols=[[],[]];
  OFF.them=[]; OFF.us=[];
  state.round=ri; state.placed=[];
  ROUNDS[ri].items.forEach((it,i)=>{ const w=W[it.id]; w.place='rack'; w.slot=i; w.g.visible=true; w.g.position.copy(targetPos(w)); });
  updateHud();
}
function startMeeting(){
  ov('needsCard', false); state.phase='play'; meetingAt=performance.now(); setModal(); updateHud(); save();
  // the rival's features drop on, the heaviest at the bottom and any counter-move last
  const ri=state.round, list=sc.rivalsIn(ri, state.won).map((r,i)=>({ r, i }));
  list.sort((a,b)=>(!!a.r.when - !!b.r.when) || (NEED[b.r.need].priority - NEED[a.r.need].priority) || a.i-b.i);
  list.forEach(({r},k)=>later(250+k*320, ()=>{
    const w=W[r.id]; stack(PLAT.them, w); w.place='them'; w.g.visible=true;
    const tp=targetPos(w), up=new THREE.Vector3(0,3.4,0); w.g.position.copy(tp).add(up);
    fly(w, { carry:.0001, approach:up, dropT:.55, sound:'place', gain:.45 });
  }));
  if(!state.restoring) $('signTitle').focus();
}
function place(id){
  const R=ROUNDS[state.round], w=W[id];
  if(state.phase!=='play' || state.placed.includes(id) || state.placed.length>=R.slots || w.place!=='rack') return;
  state.placed.push(id); stack(PLAT.us, w); w.place='us'; fly(w, { sound:'place' }); recordUse(w, 'use');
  sr(`${w.name} is on the scale. ${state.placed.length} of ${R.slots}.`); updateHud(); save();
}
function remove(id){
  const w=W[id]; if(state.phase!=='play' || !state.placed.includes(id)) return;
  state.placed.splice(state.placed.indexOf(id),1); unstack(w); w.place='rack'; fly(w, { sound:'place' }); recordUse(w, 'leave');
  sr(`${w.name} back on the rack.`); updateHud(); save();
}
weighBtn.addEventListener('click', ()=>{
  if(state.phase!=='play' || !state.placed.length) return;
  const n=state.placed.length, NUM=['','one','two','three','four'];
  $('cfTitle').textContent = n===1 ? 'Present this one?' : `Present these ${NUM[n]}?`;
  $('cfList').innerHTML=state.placed.map(id=>`<li>${esc(ITEM[id].name)}</li>`).join('');
  $('cfBody').textContent=`The committee checks ${n===1?'it':'them'} against ${THEM}, one need at a time. You can't change ${n===1?'it':'them'} after this.`;
  openCard('confirm', weighBtn, $('cfYes'));
});
$('cfNo').addEventListener('click', ()=>closeCard('confirm'));
$('cfYes').addEventListener('click', ()=>{ ov('confirm',false); sfx('lock'); weigh(); });

/*═══════════════════════════════════════════════════════════════════════════
  WEIGH — the committee goes need by need, then the features nobody asked for
═══════════════════════════════════════════════════════════════════════════*/
const LATER=[]; let gameT=0;
// Skip runs the same simulation faster: several normal-size steps per frame, never one big step.
let timeScale=1;
function later(ms, fn){ if(state.restoring) fn(); else LATER.push({ at:gameT+ms/1000, fn }); }
const skipBtn=$('skip');
skipBtn.addEventListener('click', ()=>{ if(state.phase!=='weigh') return; timeScale=12; skipBtn.disabled=true; sr('Skipping to the end of the meeting.'); });
const dk={ title:$('dkTitle'), pri:$('dkPri'), who:$('dkWho'), rows:$('dkRows'), them:$('dkThem'), us:$('dkUs'), note:$('dkNote'), table:$('dkTable') };
$('dkHThem').textContent=THEM; $('dkHUs').textContent=US;
function focusOn(ids){ const keep=new Set(ids); for(const w of WL){ const on=keep.has(w.id); w.btn.classList.toggle('on', on); if(w.g.visible) setDim(w, !on); } }
function renderReqs(x){
  dk.rows.innerHTML=x.need.reqs.map(q=>`<tr><td>${esc(q.text)}</td><td class="ic">${ICON[x.them.includes(q.id)?'met':'no']}</td><td class="ic">${ICON[x.us.includes(q.id)?'met':'no']}</td></tr>`).join('');
  dk.them.textContent=x.them.length; dk.us.textContent=x.us.length;
}
const resultWord = x => x.winner ? `${x.winner==='us'?US:THEM} +${x.points}` : !x.us.length && !x.them.length ? 'Nobody' : 'Tie';

function weigh(){
  if(state.phase!=='play' || !state.placed.length) return;
  const ri=state.round, o=sc.roundOutcome(ri, state.placed, state.won);
  // of the tied best sets, the one the learner presented if it is one
  if(!state.restoring){ const best=bestSets(ri), mine=best.find(ids=>ids.length===state.placed.length && ids.every(id=>state.placed.includes(id)));
    lms.record({ id:`${ROUNDS[ri].id}.present`, description:`What to present at ${ROUNDS[ri].name}, up to ${ROUNDS[ri].slots} features`,
      response:state.placed, correct:mine || best[0], latencyMs:performance.now()-meetingAt }); }
  state.phase='weigh'; state.outcomes[ri]=o; state.picks[ri]=[...state.placed];
  FR.uT=1; if(state.restoring) FR.u=1;
  dockEl.classList.add('on'); skipBtn.disabled=false; setModal(); updateHud(); save();
  if(!state.restoring) skipBtn.focus();
  let t=600; const at=(ms, fn)=>{ t+=ms; later(t, fn); };
  o.needs.forEach((x,k)=>{
    const busy = x.rivals.length || x.feats.length;
    at(k?300:0, ()=>{
      dk.title.textContent=`“${x.need.said}”`; dk.pri.textContent=`Need ${k+1} of ${o.needs.length}`; dk.who.textContent=x.need.who;
      dk.table.hidden=false; renderReqs(x); dk.note.innerHTML=''; dk.them.textContent=0; dk.us.textContent=0;
      dk.table.classList.remove('w-us','w-them'); winLight(null); for(const w of WL) w.win=false;
      focusOn([...x.rivals, ...x.feats]);
      sr(`${x.need.who}: ${x.need.said} ${THEM} meets ${x.them.length} of ${x.need.reqs.length}, ${US} meets ${x.us.length}.`);
    });
    let cT=0, cU=0;
    x.need.reqs.forEach((q,j)=> at(j?650:900, ()=>{
      dk.rows.children[j].classList.add('on');
      if(x.them.includes(q.id)) dk.them.textContent=++cT;
      if(x.us.includes(q.id)) dk.us.textContent=++cU;
      sfx('place', .35);
    }));
    at(600, ()=>{
      if(x.winner){ dk.table.classList.add('w-'+x.winner); winLight(x.winner);
        for(const id of x.winner==='us'?x.feats:x.rivals) W[id].win=true;
        sfx(x.winner==='us'?'take-us':'take-them', .8); }
      else { dk.note.innerHTML='<p class="tie">Tie</p>'; sfx('take-even', .7); }
    });
    if(busy) at(1000, ()=>{
      const out = x.winner==='us' ? x.rivals : x.winner==='them' ? x.feats : [...x.rivals, ...x.feats];
      for(const id of out) takeOff(W[id]);
      if(out.length) later(750, ()=>sfx('lock', .9));
    });
    at(busy?1700:900, ()=>{});
  });
  for(const id of o.padding){
    const it=ITEM[id];
    at(300, ()=>{ dk.table.classList.remove('w-us','w-them'); winLight(null); for(const w of WL) w.win=false; dk.title.textContent=it.name; dk.pri.textContent='Not asked for'; dk.table.hidden=true;
      dk.note.innerHTML=`<p>Nobody asked for this.</p>`; dk.who.textContent='';
      focusOn([id]); sr(`${it.name}: nobody asked for this. It comes off.`); });
    at(900, ()=>{ takeOff(W[id]); sfx('take-them', .6); });
    at(1100, ()=>{});
  }
  at(500, showSummary);
}

/*═══════════════════════════════════════════════════════════════════════════
  BETWEEN MEETINGS, RESULTS, SCORM
═══════════════════════════════════════════════════════════════════════════*/
const lms=connectScorm();
function save(){ if(!lms.connected || state.restoring) return;
  lms.save(JSON.stringify({ v:4, contentVersion:CONTENT.version, round:state.round, picks:state.picks.slice(0,state.round),
    placed:state.placed, weighed:state.phase==='weigh' || state.phase==='summary' }));
  // how far through the deal: each meeting is an equal share, half of it for the picks, then the check
  const R=ROUNDS[state.round], p=state.phase, part=p==='play' ? .5*state.placed.length/R.slots : p==='weigh' ? .75 : p==='summary' ? 1 : 0;
  const where=p==='play' ? `${state.placed.length} of ${R.slots} used` : p==='weigh' ? 'the committee is checking' : p==='summary' ? 'checked' : 'meeting notes';
  lms.progress({ location:`${R.name}: ${where}`, measure:(state.round+part)/N });
}
/* Decision records. The right picks for a meeting are every set of features that ends the deal best from the needs
   already won (later meetings played as well as they can be). Each Use and Remove is recorded against them, and so is
   what the learner presents. A restored save records nothing: those decisions were recorded when they were made. */
let meetingAt=performance.now();
const BEST={};
function bestSets(ri){
  const key=ri+':'+[...state.won].sort().join(',');
  if(BEST[key]) return BEST[key];
  const end=ids=>{ const o=sc.roundOutcome(ri, ids, state.won), w=new Set(state.won); o.won.forEach(x=>w.add(x));
    return o.us-o.them + (ri<N-1 ? sc.bestFrom(ri+1, w).margin : 0); };
  const sets=sc.choices(ri).map(ids=>({ ids, m:end(ids) })), top=Math.max(...sets.map(x=>x.m));
  return BEST[key]=sets.filter(x=>x.m===top).map(x=>x.ids);
}
function recordUse(w, response){
  if(state.restoring) return;
  const R=ROUNDS[state.round], right=bestSets(state.round).some(ids=>ids.includes(w.id));
  lms.record({ id:`${R.id}.${w.id}`, description:`Use ${w.name} at ${R.name}?`, response, correct:right ? 'use' : 'leave',
    latencyMs:performance.now()-(CARD===w ? cardAt : meetingAt) });
}
function tallyTable(o, withPoints){
  const head=`<caption>Requirements each side meets</caption><thead><tr><th scope="col">Need</th><th scope="col">${esc(THEM)}</th><th scope="col">${esc(US)}</th>${withPoints?'<th scope="col">Points</th>':''}</tr></thead>`;
  const cell=(x, side)=> x.winner===side && !withPoints ? `<b>${x[side].length} +${x.points}</b>` : `${x[side].length}`;
  const rows=o.needs.map(x=>`<tr><td>${esc(x.need.name)}</td><td>${cell(x,'them')}</td><td>${cell(x,'us')}</td>${withPoints?`<td>${esc(resultWord(x))}</td>`:''}</tr>`);
  for(const id of o.padding) rows.push(`<tr><td>${esc(ITEM[id].name)}, not asked for</td><td></td><td></td>${withPoints?'<td></td>':''}</tr>`);
  return head+'<tbody>'+rows.join('')+'</tbody>';
}
function showSummary(){
  for(const w of WL) settle(w);
  timeScale=1; state.phase='summary'; dockEl.classList.remove('on'); focusOn([]); winLight(null); for(const w of WL){ setDim(w,false); w.win=false; }
  const ri=state.round, R=ROUNDS[ri], o=state.outcomes[ri], last=ri===N-1;
  // one meeting: the results follow the weigh-in, with no summary in between
  if(N===1){ o.won.forEach(x=>state.won.add(x)); updateHud(); save(); showResults(); return; }
  shown.us+=o.us; shown.them+=o.them;
  const wonNow=new Set([...state.won, ...o.won]);
  $('smTitle').textContent=R.name;
  $('smScore').innerHTML=`This meeting: <b>${esc(US)} ${o.us} · ${esc(THEM)} ${o.them}</b>`;
  $('smTable').innerHTML=tallyTable(o, true);
  const notes=[];
  if(!last) for(const r of sc.rivalsIn(ri+1, wonNow).filter(r=>r.when))
    notes.push(`<p><b>Next meeting:</b> ${esc(THEM)} adds ${esc(r.name)}, because you won ${esc(NEED[r.when.won].name)}.</p>`);
  $('smNotes').innerHTML=notes.join('');
  $('smDeal').innerHTML=`Deal so far: <b>${esc(US)} ${shown.us} · ${esc(THEM)} ${shown.them}</b>`;
  $('smGo').textContent=last?'Results':'Next meeting';
  sfx('unroll', .6); updateHud(); save();
  lastFocus=null; ov('summary', true); $('smGo').focus();
}
$('smGo').addEventListener('click', ()=>{
  const ri=state.round, o=state.outcomes[ri];
  o.won.forEach(x=>state.won.add(x));
  if(ri===N-1){ ov('summary',false); showResults(); return; }
  ov('summary',false); setupRound(ri+1); FR.uT=0; state.phase='needs'; setModal(); save(); openNeeds(true);
});

let RS=[];
function showTab(ri, focus=false){
  $('rsTabs').querySelectorAll('[role=tab]').forEach((t,k)=>{ t.setAttribute('aria-selected', String(k===ri)); t.tabIndex=k===ri?0:-1; });
  const panel=$('rsPanel'); panel.setAttribute('aria-labelledby', `rsTab${ri}`); panel.innerHTML=RS[ri].html; $('rsPicks').innerHTML=RS[ri].picks;
  if(focus) $(`rsTab${ri}`).focus();
}
$('rsTabs').addEventListener('keydown', e=>{
  const k=RS.findIndex((_,i)=>$(`rsTab${i}`).getAttribute('aria-selected')==='true'), n=RS.length;
  const to = e.key==='ArrowRight' ? (k+1)%n : e.key==='ArrowLeft' ? (k-1+n)%n : e.key==='Home' ? 0 : e.key==='End' ? n-1 : -1;
  if(to<0) return; e.preventDefault(); showTab(to, true);
});
// What is left on each pan is that side's total: a weight's size is its need's priority, and the losing side's
// weight comes off. Each side's column lists the needs it kept a weight for; ties and features nobody asked for are muted.
function sidesHtml(o){
  const q=x=>`<span>${esc(x.need.name)}</span>`, said=x=>`<i>“${esc(x.need.quote)}”</i>`;
  const won=side=>o.needs.filter(x=>x.winner===side).map(x=>{ const other=side==='us'?'them':'us';
    return `<li>${q(x)}<span class="m">${x[side].length} to ${x[other].length}</span><span class="p">+${x.points}</span>${said(x)}</li>`; });
  const ties=o.needs.filter(x=>!x.winner).map(x=>`<li class="minus">${q(x)}<span class="m">${x.us.length} to ${x.them.length}</span><span class="p">Tie</span>${said(x)}</li>`);
  const extra=o.padding.map(id=>`<li class="minus"><span>${esc(ITEM[id].name)}</span><span class="m"></span><span class="p"></span><i>Nobody asked for this.</i></li>`);
  const col=(side, name, total, rows)=>`<div class="${side}"><div class="top"><b>${esc(name)}</b><span class="n">${total}</span></div><ul>${rows.join('')}</ul></div>`;
  return `<div class="sides">${col('us', US, o.us, [...won('us'), ...ties, ...extra])}${col('them', THEM, o.them, won('them'))}</div>`;
}
function showResults(){
  state.phase='done'; state.round=N; setModal();
  const deal=sc.dealOutcome(state.picks), best=sc.bestDeal(), worst=sc.worstDeal();
  if(!state.finished){ state.finished=true;
    lms.save(JSON.stringify({ v:4, contentVersion:CONTENT.version, round:N, picks:state.picks, placed:[], weighed:false }));
    lms.finish({ score:sc.lmsScore(deal.margin, best.margin, worst.margin), max:100, passed:deal.won });
    lms.progress({ location:'Results', measure:1 });
    if(!state.restoring) audio.finish(deal.won?'victory':'defeat'); }
  $('rsTitle').textContent = deal.us>deal.them ? `${CLIENT} picks ${US}` : deal.us<deal.them ? `${CLIENT} picks ${THEM}` : `${CLIENT} can't decide`;
  $('rsSub').textContent = deal.us>deal.them ? `Your side of the scale is heavier, ${deal.us} to ${deal.them}.`
    : deal.us<deal.them ? `${THEM}'s side of the scale is heavier, ${deal.them} to ${deal.us}.` : `The scale is level, ${deal.us} to ${deal.them}.`;
  // one tab per meeting; it opens on the first meeting where a better pick was there
  const won=new Set(), names=ids=>listOf(ids.map(id=>ITEM[id].name));
  RS = deal.rounds.map((o,ri)=>{
    const before=new Set(won), here=sc.bestFrom(ri, before), after=new Set([...won, ...o.won]);
    const mine=(o.us-o.them) + (ri<N-1 ? sc.bestFrom(ri+1, after).margin : 0);
    o.won.forEach(x=>won.add(x));
    const joined=sc.rivalsIn(ri, before).filter(r=>r.when).map(r=>` ${esc(THEM)} added ${esc(r.name)} here, because you won ${esc(NEED[r.when.won].name)}.`);
    const picks=`<b>You used</b> ${esc(names(state.picks[ri]))}.<br>`
      + (mine>=here.margin ? `Your picks were the best${N>1?' for this meeting':''}.` : `<b>Best pick</b> ${esc(names(here.picks[0]))}.`) + joined.join('');
    return { o, best:mine>=here.margin, html:sidesHtml(o), picks };
  });
  // one meeting has one panel and no tabs
  const tabs=$('rsTabs'); tabs.style.setProperty('--rc', N); tabs.hidden=N===1;
  if(N===1){ const panel=$('rsPanel'); panel.removeAttribute('role'); panel.removeAttribute('tabindex'); panel.innerHTML=RS[0].html; $('rsPicks').innerHTML=RS[0].picks; ov('results', true); $('rsTitle').focus(); return; }
  tabs.innerHTML=RS.map((r,ri)=>`<button type="button" role="tab" class="btn tab" id="rsTab${ri}" aria-controls="rsPanel">`
    + `<b>${esc(ROUNDS[ri].name)}</b><span>${esc(US)} ${r.o.us}, ${esc(THEM)} ${r.o.them}</span></button>`).join('');
  tabs.querySelectorAll('[role=tab]').forEach((t,ri)=>t.addEventListener('click', ()=>showTab(ri)));
  showTab(Math.max(0, RS.findIndex(r=>!r.best)));
  ov('results', true); $('rsTitle').focus();
}
// the reload keeps the address as it is, query string and all; lms.reload() first keeps the LMS session open across it
$('startOver').addEventListener('click', ()=>{ lms.save(''); lms.reload(); location.reload(); });

function startGame(){ ov('intro',false); audio.reset(); audio.bed('music'); state.phase='needs'; openNeeds(true); }
$('start').addEventListener('click', startGame);
// the briefing memo, and How to play: one plain line per control
$('inTitle').textContent=CLIENT; $('inFrom').textContent=CONTENT.memo.from; $('inAbout').textContent=CONTENT.memo.about;
$('inBody').innerHTML=CONTENT.situation.map(t=>`<p>${esc(t)}</p>`).join('');
$('howList').innerHTML=[
  'Click a weight to read its card.',
  `Use puts a feature on your pan. Remove takes it off. ${N>1?'Each meeting says how many you can use.':`You can use ${ROUNDS[0].slots}.`}`,
  'Meeting notes shows what the client said.',
  'Present sends your picks to the committee.',
  `The committee checks one need at a time. The side that meets less of it loses its weight. A tie takes both off, and so does a feature nobody asked for.`,
  N>1 ? `After the last meeting, the heavier pan wins.` : 'The heavier pan wins.',
].map(t=>`<li>${esc(t)}</li>`).join('');
$('howBtn').addEventListener('click', ()=>{ sfx('card-open', .35); openCard('how', $('howBtn')); });

setupRound(0); layout(); setModal();
(function restore(){ const raw=lms.resumeData(); if(!raw) return; try{ const s=JSON.parse(raw);
  if(s.v!==4 || s.contentVersion!==CONTENT.version) return;   // an older save starts a fresh run
  state.restoring=true; ov('intro',false);
  for(let ri=0; ri<Math.min(s.round, N); ri++){ const o=sc.roundOutcome(ri, s.picks[ri]||[], state.won);
    state.picks[ri]=s.picks[ri]||[]; state.outcomes[ri]=o; o.won.forEach(x=>state.won.add(x)); shown.us+=o.us; shown.them+=o.them; }
  if(s.round>=N){ showResults(); }
  else { setupRound(s.round); startMeeting(); for(const id of s.placed||[]) place(id); if(s.weighed) weigh(); else audio.bed('music'); }
}catch(e){ console.warn('[scale] the saved game could not be restored', e); } finally { state.restoring=false; } })();
updateHud();
if(isOn('intro')) $('start').focus();

/*═══════════════════════════════════════════════════════════════════════════
  FRAME
═══════════════════════════════════════════════════════════════════════════*/
const DIPK=160;
function balanceStep(dt){
  // the beam tips by what rests on each pan: a weight counts its size
  const mass=P=>P.cols.flat().reduce((m,id)=>{ const w=W[id]; return w.flight ? m : m+w.size; }, 0);
  const target=-clamp((mass(PLAT.us)-mass(PLAT.them))/6, -1, 1)*SC.maxTilt;
  // critically damped: the beam swings to its angle and stops there, no wobble
  BAL.om += (BAL.K*(target-BAL.th) - 2*Math.sqrt(BAL.K)*BAL.om)*dt; BAL.th += BAL.om*dt;
  const s=Math.sin(BAL.th);
  BEAM.rotation.z=BAL.th;
  for(const P of Object.values(PLAT)){
    P.dipV += (-DIPK*P.dip - 2*Math.sqrt(DIPK)*P.dipV)*dt; P.dip += P.dipV*dt;
    // each pan hangs level from its beam end
    P.x=SC.x+P.s*SC.A*Math.cos(BAL.th); P.y=SC.yP+P.s*SC.A*s+P.dip; P.top=P.y;
    P.g.position.set(P.x, P.y, 0);
  }
}
function stepWeight(w, dt){
  const want = (w.hover && state.phase==='play' && !w.flight) || (w.win && !w.flight && PLAT[w.place]) ? 1 : 0;
  w.glow += (want-w.glow)*Math.min(1, dt*14);
  w.body.material.emissiveIntensity = w.glow*.55;
  if(w.place==='hidden') return;
  const f=w.flight, tp=targetPos(w);
  if(f){
    f.t+=dt;
    if(f.t<f.carry){ const u=f.ease(f.t/f.carry); _b.copy(tp).add(f.approach);
      w.g.position.lerpVectors(f.from, _b, u); w.g.position.y += Math.sin(u*Math.PI)*f.arc;
      if(f.q) w.g.quaternion.slerpQuaternions(f.q0, f.q, u);
      if(f.s!=null) w.g.scale.setScalar(f.s0.x+(f.s-f.s0.x)*u);
    } else { const u=Math.min(1,(f.t-f.carry)/f.dropT);
      w.g.position.copy(tp).addScaledVector(f.approach, 1-u*u);
      if(f.q) w.g.quaternion.copy(f.q); if(f.s!=null) w.g.scale.setScalar(f.s);
      if(u>=1) land(w); }
    return;
  }
  // at rest it stands on what is under it, and falls when that is taken away
  const p=w.g.position, gap=p.y-tp.y;
  if(w.fallV || gap>.02){ w.fallV+=GRAV*dt; p.y-=w.fallV*dt;
    if(p.y<=tp.y){ p.y=tp.y; if(w.fallV>1.6){ if(PLAT[w.place]) PLAT[w.place].dipV-=.35; sfx('place', .3); } w.fallV=0; } }
  else p.y=tp.y;
  p.x=tp.x; p.z=tp.z;
}
function simulate(dt){
  gameT+=dt;
  for(const x of LATER.filter(x=>x.at<=gameT).sort((p,q)=>p.at-q.at)){ LATER.splice(LATER.indexOf(x),1); x.fn(); }
  balanceStep(dt);
  for(const k in WINL){ const o=WINL[k], P=PLAT[k]; o.v += (o.want-o.v)*Math.min(1, dt*(o.want?6:2.5));
    const Pl=PLATES[k]; Pl.lit.material.opacity=o.v; Pl.halo.material.opacity=o.v*.8; Pl.frameM.material.emissiveIntensity=o.v*.9; Pl.grp.scale.setScalar(1+o.v*.1); }
  for(const w of WL) if(w.g.visible) stepWeight(w, dt);
}
const clock=new THREE.Clock();
function frame(){
  // A slow frame is cut into steps of 50 ms or less, so a slow laptop plays the meeting at the same pace; a gap longer
  // than a quarter second (a hidden tab) is dropped.
  const dt=Math.min(clock.getDelta(), .25), n=Math.ceil(dt/.05)||1;
  for(let i=0;i<timeScale*n;i++) simulate(dt/n);   // a skip takes several normal steps; one big step would throw the springs
  FR.u += (FR.uT-FR.u)*Math.min(1, dt*3); if(Math.abs(FR.uT-FR.u)<.001) FR.u=FR.uT;
  frameCamera(); renderer.render(scene, camera); projectLabels(); requestAnimationFrame(frame);
}
frame();

window.__dbg={ audio, state, shown, W, PLAT, sc, CONTENT, camera, place, remove, weigh, toScreen,
  skip:()=>skipBtn.click(), get timeScale(){ return timeScale; }, get wf(){ return wfPx; },
  busy:()=>LATER.length>0 || WL.some(w=>w.g.visible && (w.flight || w.fallV)),
  // the best picks for this meeting from where the learner stands
  best:()=>sc.bestFrom(state.round, state.won).picks[0] };
</script>
</body>
</html>
